<div class="auth-wrapper">
  <span class="bracket-mark auth__bracket">{{ '{' }}</span>
  <div class="auth-card">
    <div class="auth-header">
      <app-logo [size]="34" />
      <div class="logo">Órbita <span>Solutions</span></div>
      <h2>Iniciar sesión</h2>
      <p>Acceso a la plataforma de cobros diferidos y bootcamp</p>
    </div>

    <!-- Banner de Postulación en Evaluación -->
    <div *ngIf="isEvaluationAlert" class="alert alert-warning">
      <div class="alert-content">
        <strong>Postulación en evaluación</strong>
        <p>Si tienes dudas comunícate con <strong>softwareorbita@gmail.com</strong></p>
      </div>
    </div>

    <!-- Banner de Error general -->
    <div *ngIf="errorMessage && !isEvaluationAlert" class="alert alert-danger">
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu.correo@gmail.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading">
        <span *ngIf="!loading">Ingresar a la plataforma</span>
        <span *ngIf="loading">Cargando...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Aún no has enviado tu postulación? <a routerLink="/postular">Postula aquí</a></p>
      <p><a routerLink="/">← Volver al inicio</a></p>
    </div>
  </div>
</div>

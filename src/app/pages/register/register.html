<div class="auth-wrapper">
  <span class="bracket-mark auth__bracket">{{ '}' }}</span>
  <div class="auth-card auth-card--wide">
    <div class="auth-header">
      <app-logo [size]="34" />
      <div class="logo">Órbita <span>Solutions</span></div>
      <h2>Postular al bootcamp</h2>
      <p>Formulario de ingreso para el programa de pago diferido (ISA)</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      <span>{{ successMessage }}</span>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label for="fullName">Nombre completo *</label>
        <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" placeholder="Juan Pérez" required />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="juan.perez@gmail.com" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Teléfono / WhatsApp</label>
          <input type="text" id="phone" [(ngModel)]="phone" name="phone" placeholder="+51987654321" />
        </div>

        <div class="form-group">
          <label for="documentNumber">DNI / Documento</label>
          <input type="text" id="documentNumber" [(ngModel)]="documentNumber" name="documentNumber" placeholder="72819034" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading">
        <span *ngIf="!loading">Enviar postulación</span>
        <span *ngIf="loading">Procesando...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta aprobada? <a routerLink="/login">Inicia sesión</a></p>
      <p><a routerLink="/">← Volver al inicio</a></p>
    </div>
  </div>
</div>

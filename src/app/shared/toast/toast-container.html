<div class="toast-stack" aria-live="polite" aria-atomic="false">
  <div
    *ngFor="let t of toastService.toasts()"
    class="toast-item"
    [ngClass]="'toast-' + t.type"
    role="status"
  >
    <span class="toast-icon">
      <svg *ngIf="t.type === 'success'" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="t.type === 'error'" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="t.type === 'warning'" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a1 1 0 00.86 1.5h18.64a1 1 0 00.86-1.5L13.71 3.86a1 1 0 00-1.72 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="t.type === 'info'" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <path d="M12 16v-5m0-3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span *ngIf="t.type === 'loading'" class="toast-spinner"></span>
    </span>

    <span class="toast-message">{{ t.message }}</span>

    <button
      *ngIf="t.type !== 'loading'"
      class="toast-close"
      (click)="toastService.dismiss(t.id)"
      aria-label="Cerrar notificación"
    >×</button>
  </div>
</div>

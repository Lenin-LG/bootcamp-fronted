<div
  *ngIf="confirmDialog.state() as s"
  class="modal-backdrop confirm-backdrop"
  (click)="confirmDialog.respond(false)"
>
  <div class="modal-content confirm-content" (click)="$event.stopPropagation()">
    <div class="confirm-icon" [ngClass]="'confirm-icon-' + s.variant">
      <svg *ngIf="s.variant === 'primary'" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="s.variant === 'warning'" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a1 1 0 00.86 1.5h18.64a1 1 0 00.86-1.5L13.71 3.86a1 1 0 00-1.72 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="s.variant === 'danger'" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h3 class="confirm-title">{{ s.title }}</h3>
    <p class="confirm-message">{{ s.message }}</p>

    <div class="confirm-actions">
      <button class="btn-ghost btn-ghost--light" (click)="confirmDialog.respond(false)">
        {{ s.cancelText }}
      </button>
      <button
        class="btn-confirm"
        [ngClass]="'btn-confirm-' + s.variant"
        (click)="confirmDialog.respond(true)"
      >
        {{ s.confirmText }}
      </button>
    </div>
  </div>
</div>
